[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "aidub-studio"
version = "0.1.0.dev0"
description = "Local-first, production-oriented AI movie dubbing workstation"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Proprietary" }
authors = [{ name = "AI Dubbing Studio Engineering" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Win32 (MS Windows)",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "chardet>=5.2,<6",
  "imageio-ffmpeg>=0.5.1,<1",
  "numpy>=2.0,<3",
  "pillow>=10.0,<12",
  "psutil>=6.0,<8",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.10,<3",
  "scipy>=1.14,<2",
  "soundfile>=0.12,<1",
  "structlog>=25.4,<26",
  "typing-extensions>=4.15,<5",
]

[project.optional-dependencies]
ai = [
  "demucs>=4.0,<5",
  "edge-tts>=6.1,<8",
  "faster-whisper>=1.0,<2",
  "librosa>=0.10,<1",
  "pyannote.audio>=3.1,<4",
  "pyloudnorm>=0.1.1,<1",
  "torch>=2.2,<3",
]
asr = [
  "faster-whisper>=1.0,<2",
]
desktop = [
  "PySide6>=6.9,<7",
  "qasync>=0.28,<1",
]
diarization = [
  "pyannote.audio>=3.1,<4",
  "torch>=2.2,<3",
]
separation = [
  "demucs>=4.0,<5",
  "torch>=2.2,<3",
]
tts = [
  "edge-tts>=6.1,<8",
]
llm = [
  "google-generativeai>=0.8,<1",
  "openai>=1.50,<2",
]
persistence = [
  "alembic>=1.16,<2",
  "platformdirs>=4.3,<5",
  "sqlalchemy>=2.0.41,<3",
]
all = [
  "aidub-studio[ai,asr,desktop,diarization,llm,persistence,separation,tts]",
]
dev = [
  "hypothesis>=6.136,<7",
  "imageio-ffmpeg>=0.5.1,<1",
  "mypy>=1.17,<2",
  "pre-commit>=4.2,<5",
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]

[project.scripts]
aidub = "aidub.cli:main"
aidub-studio = "aidub.ui.application:run_desktop"

[tool.hatch.build.targets.wheel]
packages = ["src/aidub"]
artifacts = [
  "src/aidub/infrastructure/persistence/migrations_sql/*.sql",
]

[tool.hatch.build.targets.wheel.force-include]
"resources/i18n" = "aidub/i18n/catalogs"

[tool.hatch.build.targets.sdist]
include = [
  "src/aidub",
  "resources/i18n",
  "migrations",
  "tests",
  "docs",
  "benchmarks",
  "README.md",
  "ENTERPRISE_IMPLEMENTATION_PLAN.md",
]

[tool.hatch.envs.default]
features = ["dev"]

[tool.hatch.envs.default.scripts]
test = "pytest {args:tests}"
lint = "ruff check ."
format = "ruff format ."
format-check = "ruff format --check ."
typecheck = "mypy src tests"
check = ["format-check", "lint", "typecheck", "test"]

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--import-mode=importlib",
  "--showlocals",
  "-ra",
]
testpaths = ["tests"]
pythonpath = ["src"]
xfail_strict = true
filterwarnings = [
  "error",
  "ignore::ResourceWarning",
  "ignore::pytest.PytestUnraisableExceptionWarning",
]
markers = [
  "e2e: end-to-end integration and dubbing pipeline tests",
  "slow_net: tests that require network access or take a long time over network",
]

[tool.coverage.run]
branch = true
source = ["aidub"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# Headless foundation gate. Ratchet toward 85 as native Qt/media lanes land.
fail_under = 60
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = [".wheel-smoke", ".wheel-install-smoke"]

[tool.ruff.lint]
select = [
  "A",
  "ANN",
  "ARG",
  "ASYNC",
  "B",
  "BLE",
  "C4",
  "DTZ",
  "E",
  "F",
  "FA",
  "FBT",
  "FURB",
  "I",
  "ICN",
  "LOG",
  "N",
  "PERF",
  "PIE",
  "PLC",
  "PLE",
  "PLR",
  "PLW",
  "PTH",
  "PYI",
  "RET",
  "RSE",
  "RUF",
  "S",
  "SIM",
  "SLF",
  "T10",
  "T20",
  "TC",
  "TRY",
  "UP",
  "W",
]
ignore = [
  "ANN401",
  # Pydantic resolves these annotations at runtime when generating validation/JSON schemas.
  "TC001",
  "TC002",
  "TC003",
  # Named aliases retain clearer generated Pydantic schema definitions than anonymous PEP 695 aliases.
  "UP040",
  "UP047",
  # Domain operation exceptions intentionally use concise public API names.
  "N818",
  # Aggregate invariant validators and parsing state machines are kept together without arbitrary splitting.
  "PLR0911",
  "PLR0912",
  "PLR0913",
  "PLR0915",
  # In Ruff 0.6+, PLR0917 was split from PLR0913 for too many positional arguments.
  "PLR0917",
  "PLR2004",
  # Lazy-loading of optional ML runtimes, provider SDKs, and Qt UI elements is by architectural design.
  "PLC0415",
  "S101",
  # Quality control evaluators use "PASS", "PASS_GREEN" status constants, which triggers false-positive password checks.
  "S105",
  # Safe fallback blocks (e.g. BOM detection and temporary cleanup) intentionally ignore expected exceptions.
  "S110",
  # Media operations invoke local ffmpeg/ffprobe binary commands with parameterized argument lists.
  "S603",
  # Same-module value objects share a private rate guard; it is not an external API access.
  "SLF001",
  "TRY003",
  # Diagnostic logging and exception handling follow application conventions.
  "TRY300",
  "TRY301",
  "TRY400",
  "TRY401",
  # UI workers, background processes, and defensive probes catch broad Exception for crash resilience.
  "BLE001",
  # Boolean positional flags and default arguments are standard across the established API surface.
  "FBT001",
  "FBT002",
  "FBT003",
  # Qt event overrides, signal callbacks, and abstract adapter protocols declare parameters required by caller signatures.
  "ARG001",
  "ARG002",
  "ARG003",
  "ARG004",
  # Nested conditional checks and explicit try/except blocks maintain clearer trace points than one-line suppressions.
  "SIM102",
  "SIM105",
  # Explicit iteration in streaming audio buffer processing preserves imperative clarity.
  "PERF401",
  # Simple lambdas in Qt signal-slot bindings (.connect(lambda: ...)) are idiomatic.
  "PLW0108",
  # Unused loop indices in grid/track geometry calculations.
  "B007",
  # Explicit list concatenation used in media command building.
  "RUF005",
  # Bengali localization text and UI glyphs contain unicode characters.
  "RUF001",
  "RUF002",
  # Formatter manages general line-length; long prompts, Qt stylesheets, and ASS templates remain unbroken.
  "E501",
]
allowed-confusables = ["–", "—", "×", "›", "‹", "“", "”", "’", "‘", "…"]

[tool.ruff.lint.per-file-ignores]
# Tests contain long fixture strings, dynamic test-case imports, and Bengali sample text.
"tests/**/*.py" = ["ANN", "ARG", "E501", "PLC0415", "PLR2004", "RUF001", "RUF002", "SLF001"]
# Standalone development and research scripts use console output, script path bootstrapping, and long prompts.
"scripts/**/*.py" = ["ANN", "ARG", "BLE", "E402", "E501", "F841", "PLR", "PLW", "PTH", "RUF", "S", "T201", "W291"]
# Packaging scripts use console print output for build feedback.
"packaging/**/*.py" = ["E501", "T201"]

[tool.ruff.lint.isort]
known-first-party = ["aidub"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
warn_unreachable = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
# Qt ships its own stubs inside PySide6 but mypy still needs the override for sub-packages.
module = ["PySide6.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# No py.typed marker — audio I/O library ships no stubs.
module = ["soundfile.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# No py.typed marker — loudness normalisation library ships no stubs.
module = ["pyloudnorm.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# No py.typed marker — charset detection library ships no stubs.
module = ["chardet.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Optional separation extra; ships no stubs and imports torch internally.
module = ["demucs.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Optional ASR extra; C-extension package ships no stubs.
module = ["faster_whisper.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Optional LLM extra — Google Generative AI SDK ships no py.typed.
module = ["google.*", "google.generativeai.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Optional LLM extra — OpenAI SDK ships py.typed in recent versions but
# the installed version may lag; keep override for consistent CI behaviour.
module = ["openai.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Optional desktop extra — Qt async bridge ships no stubs.
module = ["qasync.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Optional diarization/separation extra — PyTorch ships no bundled stubs.
module = ["torch.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Optional diarization extra — pyannote ships no stubs for sub-packages.
module = ["pyannote.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# librosa ships no py.typed marker.
module = ["librosa.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# structlog does ship stubs but may emit incomplete generics in strict mode.
module = ["structlog.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# imageio-ffmpeg (dev extra) ships no stubs.
module = ["imageio_ffmpeg.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# psutil ships no py.typed marker without types-psutil
module = ["psutil.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# torchaudio ships no py.typed marker
module = ["torchaudio.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# ctranslate2 ships no py.typed marker
module = ["ctranslate2.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# edge_tts ships no py.typed marker
module = ["edge_tts.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Tests use dynamic mocking, monkeypatching, and pytest fixtures
module = ["tests.*"]
ignore_errors = true
